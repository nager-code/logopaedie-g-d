<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fips der Drache – alle Posen</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F4FBF8; color: #1F3B33; }
  header { padding: 28px 24px 8px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 28px; }
  p.sub { margin: 0; color: #4E6E64; }
  .bg { display: flex; gap: 8px; justify-content: center; margin: 16px 0 0; }
  .bg button { border: 1px solid #BFDCCF; background: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
  .bg button[aria-pressed="true"] { background: #2F7D63; color: #fff; border-color: #2F7D63; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; padding: 24px; max-width: 1200px; margin: 0 auto; }
  figure { margin: 0; background: var(--card, #fff); border-radius: 18px; padding: 14px 14px 10px; box-shadow: 0 2px 10px rgba(47,125,99,.10); text-align: center; }
  figure img { width: 100%; height: auto; display: block; }
  figcaption { font-weight: 600; margin-top: 6px; }
  figcaption small { display: block; font-weight: 400; color: #5D7C72; font-size: 13px; margin-top: 2px; }
  code { font-size: 12px; color: #7A938B; }
</style>
</head>
<body>
<header>
  <h1>Fips der Drache</h1>
  <p class="sub">15 Posen · animierte SVGs · Animationen ruhen bei „Bewegung reduzieren“</p>
  <div class="bg" role="group" aria-label="Hintergrund">
    <button aria-pressed="true" data-bg="#ffffff">Weiß</button>
    <button aria-pressed="false" data-bg="#FFF6E3">Creme</button>
    <button aria-pressed="false" data-bg="#2B3A4A">Dunkel</button>
  </div>
</header>
<main id="grid"></main>
<script>
  const poses = [
    ["begruessung", "Begrüßung", "Start der App"],
    ["jubel", "Jubel", "Richtige Antwort"],
    ["hoppla", "Hoppla", "Falsche Antwort"],
    ["zuhoeren", "Zuhören", "Wort wird abgespielt"],
    ["nachdenken", "Nachdenken", "Kind überlegt"],
    ["staunen", "Staunen", "Neue Stufe, Belohnung"],
    ["traurig", "Traurig", "Verloren, Abschied"],
    ["verliebt", "Verliebt", "Lob, Lieblingswort"],
    ["schlafen", "Schlafen", "Inaktivität, Ende"],
    ["hungrig", "Hungrig", "Pause, Fips füttern"],
    ["grummelig", "Grummelig", "Zeit abgelaufen"],
    ["erschrocken", "Erschrocken", "Überraschung"],
    ["schuechtern", "Schüchtern", "Erster Start, Namen eingeben"],
    ["stolz", "Stolz", "Lektion geschafft"],
    ["daumen-hoch", "Daumen hoch", "Ermutigen"],
  ];
  const grid = document.getElementById("grid");
  for (const [file, name, use] of poses) {
    const f = document.createElement("figure");
    f.innerHTML = `<img src="svg/fips-${file}.svg" alt="Fips – ${name}" width="400" height="400">
      <figcaption>${name}<small>${use}</small><code>fips-${file}.svg</code></figcaption>`;
    grid.appendChild(f);
  }
  document.querySelectorAll(".bg button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".bg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.documentElement.style.setProperty("--card", b.dataset.bg);
  }));
</script>
</body>
</html>
