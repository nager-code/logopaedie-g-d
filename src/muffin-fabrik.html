<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFE3EC">
<link rel="icon" href="favicon.svg">
<!-- Muffin-Fabrik: spielbarer Prototyp für die Muffin-Party (Förderband → Teigdüse → Ofen → Verzieren).
     Eigenständige Seite – Zeichen-Bausteine (Palette, Muffin, Baby-Drache) sind aus js/pictures.js und js/egg.js übernommen. -->
<title>Muffin-Fabrik</title>
<meta name="description" content="Spielbarer Prototyp der Muffin-Fabrik">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
  .cvx{--bb:15%;position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding-top:max(10px,var(--safe-t));background:#FFF1F5;font-family:inherit}
  .cvx .close-x{position:absolute!important;top:max(10px,var(--safe-t))!important;right:12px!important;z-index:9;background:#fff;box-shadow:0 3px 0 rgba(59,44,90,.12)}
  .cv-map{position:relative;z-index:6;display:flex;align-items:flex-start;background:#fff;border-radius:24px;padding:6px 12px 4px;box-shadow:0 4px 0 rgba(59,44,90,.1);margin-right:46px}
  .cv-map > div{display:flex;flex-direction:column;align-items:center;gap:2px;width:52px}
  .cv-map span{width:34px;height:34px;border-radius:50%;background:#F4F0FB;display:flex;align-items:center;justify-content:center;font-size:16px;color:#B9A9D9;font-weight:900;filter:grayscale(1);opacity:.6}
  .cv-map small{font-size:10px;font-weight:900;color:#B9A9D9}
  .cv-map .done span{background:linear-gradient(180deg,#7DD9B4,#55BE96);color:#fff;filter:none;opacity:1;box-shadow:0 3px 0 #2F9B7A}.cv-map .done small{color:#2F9B7A}
  .cv-map .now span{background:linear-gradient(180deg,#FFD0DC,#FF88A8);color:#fff;filter:none;opacity:1;box-shadow:0 3px 0 #C9507A,0 0 0 4px #FFE3EC}.cv-map .now small{color:#E0608A}
  .cv-map > i{width:14px;height:6px;margin-top:15px;border-radius:3px;background:repeating-linear-gradient(90deg,#9C8FBF 0 3px,#C9BEDF 3px 6px)}
  .cv-say{position:relative;z-index:6;margin-top:10px;background:#fff;border-radius:22px;padding:8px 18px;font-size:18px;font-weight:900;color:#3B2C5A;box-shadow:0 5px 0 rgba(59,44,90,.1);text-align:center;max-width:calc(100% - 32px)}
  .cv-say::after{content:"";position:absolute;bottom:-10px;left:50%;margin-left:-9px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
  .cv-scene{position:relative;flex:1;width:100%;min-height:0;margin-top:-118px;padding-top:118px}
  /* Kulisse */
  .cv-wall{position:absolute;inset:0;background:radial-gradient(circle,#FFD6E2 0 2px,transparent 2.5px) 0 0/26px 26px,linear-gradient(180deg,#FFF6F9,#FFE9F0)}
  .cv-wains{position:absolute;left:0;right:0;bottom:0;height:24%;background:repeating-linear-gradient(90deg,#E3F6EE 0 22px,#CFEFE2 22px 44px);border-top:8px solid #fff;box-shadow:0 -4px 0 #F4C4D4}
  .cv-floor{position:absolute;left:0;right:0;bottom:0;height:8%;background:repeating-conic-gradient(#FFE3EC 0 25%,#fff 0 50%) 0 0/36px 36px;border-top:4px solid #F4C4D4}
  .cv-win{position:absolute;top:22%;width:23%;max-width:110px;opacity:.95}
  .cv-win svg{display:block;width:100%;filter:drop-shadow(0 4px 0 rgba(201,80,122,.12))}
  .cv-win.w1{left:5%}.cv-win.w2{left:36%}
  .cv-bunting{position:absolute;left:0;right:0;top:118px;width:100%;height:30px}
  .cv-lamps{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-around;padding:0 18%}
  .cv-lamp{width:30px;height:auto;margin-top:96px;opacity:.9}
  /* Band */
  .cv-belt{position:absolute;left:10px;right:-30px;bottom:var(--bb);height:44px;z-index:3}
  .cv-top{position:absolute;left:20px;right:0;top:0;height:16px;border:3px solid #3B2C5A;border-right:0;border-radius:8px 0 0 8px;background:repeating-linear-gradient(90deg,#5E5088 0 21px,#8A7BBF 21px 24px);overflow:hidden}
  .cv-top i{position:absolute;left:0;right:0;top:1px;height:3px;border-radius:2px;background:rgba(255,255,255,.4)}
  .cv-belt.moving .cv-top{animation:cvBelt .45s linear infinite}
  @keyframes cvBelt{to{background-position:24px 0}}
  .cv-frame{position:absolute;left:20px;right:0;top:12px;bottom:0;border:3px solid #2F9B7A;border-top:0;border-right:0;border-radius:0 0 0 14px;background:linear-gradient(180deg,#9FE8CB,#6FCFAA)}
  .cv-frame span{position:absolute;left:12px;right:0;top:50%;height:8px;translate:0 -30%;background:radial-gradient(circle,#E9FFF6 0 3px,#2F9B7A 3.5px 4.5px,transparent 5px) 0 0/34px 8px repeat-x}
  .cv-frame::after{content:"";position:absolute;left:8px;right:0;bottom:4px;height:4px;border-radius:2px;background:rgba(47,155,122,.35)}
  .cv-drum{position:absolute;left:0;top:-1px;width:46px;height:46px;border-radius:50%;background:#3B2C5A;padding:4px}
  .cv-drum i{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#E9FFF6 0 5px,#2F9B7A 5.5px 7px,transparent 7.5px),conic-gradient(#9FE8CB 0 12.5%,#6FCFAA 0 25%,#9FE8CB 0 37.5%,#6FCFAA 0 50%,#9FE8CB 0 62.5%,#6FCFAA 0 75%,#9FE8CB 0 87.5%,#6FCFAA 0);border:3px solid #2F9B7A}
  .cv-belt.moving .cv-drum i{animation:cvSpin .9s linear infinite}
  @keyframes cvSpin{to{rotate:360deg}}
  .cv-legs{position:absolute;top:100%;left:9%;right:12%;display:flex;justify-content:space-between}
  .cv-legs i{position:relative;width:18px;height:clamp(24px,5vh,50px);background:linear-gradient(90deg,#55BE96,#9FE8CB 45%,#55BE96);border-inline:3px solid #2F9B7A}
  .cv-legs i::after{content:"";position:absolute;bottom:-6px;left:-10px;right:-10px;height:10px;border-radius:5px;background:#2F9B7A}
  .cv-item{position:absolute;bottom:calc(var(--bb) + 41px);width:min(44px,11vw);translate:-50% 0;z-index:4}
  .cv-item svg{position:relative;z-index:1;display:block;width:100%}
  .cv-shadow{position:absolute;left:12%;right:12%;bottom:-3px;height:7px;border-radius:50%;background:rgba(59,44,90,.25)}
  .cv-item.wobble svg{animation:cvWob .5s ease-in-out infinite alternate;transform-origin:50% 100%}
  @keyframes cvWob{from{rotate:-5deg}to{rotate:5deg}}
  .cv-item.glow::before{content:"";position:absolute;inset:-10% -14%;border-radius:50%;background:radial-gradient(circle,rgba(255,213,74,.7),transparent 70%);z-index:0}
  /* Teigdüse */
  .cv-nozzle{position:absolute;left:50%;translate:-50% 0;top:0;bottom:calc(var(--bb) + 110px);width:min(150px,38vw);display:flex;flex-direction:column;align-items:center;z-index:5}
  .cv-pipe{position:relative;flex:1;width:24px;background:linear-gradient(90deg,#8C97A8,#E2E8F0 40%,#AEB7C6);border-inline:3px solid #5E6B7E}
  .cv-pipe i{position:absolute;left:-7px;right:-7px;height:12px;border-radius:4px;background:#AEB7C6;border:3px solid #5E6B7E}
  .cv-pipe i:first-child{top:30%}.cv-pipe i:last-child{bottom:6px}
  .cv-tank{display:block;width:100%;filter:drop-shadow(0 6px 0 rgba(201,80,122,.2));overflow:visible}
  .cv-nozzle.on .cv-tank{animation:cvSquish .5s ease-in-out infinite alternate}
  @keyframes cvSquish{from{scale:1 1}to{scale:1.04 .97}}
  .tk-b{animation:tkBub 2s ease-in infinite}.tk-b.b2{animation-delay:.7s}.tk-b.b3{animation-delay:1.3s}
  @keyframes tkBub{0%{translate:0 0;opacity:0}20%{opacity:.9}100%{translate:0 -40px;opacity:0}}
  .tk-wheel{transform-box:fill-box;transform-origin:center}
  .cv-nozzle.on .tk-wheel{animation:cvSpin 1.2s linear infinite}
  .cv-stream{position:absolute;top:100%;margin-top:-4px;width:16px;height:42px;border-radius:8px;background:linear-gradient(90deg,#F7D88A,#FFF0C2 45%,#F7D88A);overflow:hidden}
  .cv-stream i{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 8px,rgba(226,185,90,.5) 8px 11px);animation:cvFlow .35s linear infinite}
  @keyframes cvFlow{to{background-position:0 11px}}
  .cv-plop{position:absolute;top:calc(100% + 14px);right:calc(50% + 22px);font-weight:900;font-size:15px;color:#E0608A;background:#fff;border-radius:999px;padding:2px 9px;box-shadow:0 3px 0 rgba(201,80,122,.2);rotate:-8deg;animation:pop .5s}
  /* Ofen */
  .cv-oven{position:absolute;right:-14px;bottom:calc(var(--bb) + 40px);width:54%;height:min(290px,34vh);z-index:5}
  .cv-oven.small{width:27%;height:min(220px,27vh)}
  .cv-ovensvg{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(185,101,30,.2))}
  .cv-oven:not(.hot) .ov-glass,.cv-oven:not(.hot) .ov-mouth{opacity:.35}
  .cv-oven.hot .ov-glass{animation:cvGlow .6s ease-in-out infinite alternate}
  @keyframes cvGlow{to{filter:brightness(1.3)}}
  .ov-needle{transform-box:view-box;transform-origin:172px 100px;rotate:-60deg}
  .cv-oven.hot .ov-needle{rotate:70deg}
  .cv-smoke{position:absolute;right:20%;top:-30px;width:20px;height:30px}
  .cv-smoke i{position:absolute;left:0;bottom:0;font-style:normal;font-size:18px;color:#fff;text-shadow:0 0 1px #E8DDF2;animation:cvSmoke 2.4s ease-out infinite}
  .cv-smoke i:first-child{color:#FFB3C8}.cv-smoke i:nth-child(2){animation-delay:.8s}.cv-smoke i:nth-child(3){animation-delay:1.6s;color:#FFB3C8}
  @keyframes cvSmoke{0%{translate:0 0;scale:.5;opacity:0}20%{opacity:1}100%{translate:-20px -54px;scale:1.5;opacity:0}}
  .cv-fips{position:absolute;left:8%;top:-38%;width:58%;max-width:130px;rotate:-6deg;filter:drop-shadow(0 6px 0 rgba(59,44,90,.12))}
  .cv-fire{position:absolute;left:40%;top:-6%;width:46px;height:40px;rotate:120deg}
  .cv-fire i{position:absolute;left:0;top:0;width:40px;height:22px;border-radius:50% 60% 60% 50%;background:radial-gradient(ellipse at 20% 50%,#FFF6C0,#FFD54A 30%,#FF8A3D 65%,transparent 72%);animation:cvFlame .35s ease-in-out infinite alternate}
  .cv-fire i:nth-child(2){top:10px;left:8px;scale:.8;animation-delay:-.1s}.cv-fire i:nth-child(3){top:-6px;left:10px;scale:.7;animation-delay:-.2s}
  @keyframes cvFlame{from{scale:.8 .9}to{scale:1.15 1.05}}
  /* Deko-Station */
  .cv-exit{position:absolute;left:-40px;bottom:calc(var(--bb) + 40px);width:36%;height:min(200px,24vh);z-index:5}
  .cv-exit svg{width:100%;height:100%;display:block}
  .cv-lift{position:absolute;left:50%;translate:-50% 0;bottom:calc(var(--bb) + 40px);width:18px;height:clamp(60px,12vh,110px);background:linear-gradient(90deg,#8C97A8,#E2E8F0 45%,#AEB7C6);border-inline:3px solid #5E6B7E;z-index:3}
  .cv-lift::before{content:"";position:absolute;left:50%;top:-12px;translate:-50% 0;width:min(170px,44vw);height:20px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#fff 55%,#EDE6F7);border:4px solid #C9BEDF;box-shadow:0 4px 0 rgba(59,44,90,.12)}
  .cv-deco{position:absolute;left:50%;translate:-50% 0;bottom:calc(var(--bb) + 40px + clamp(60px,12vh,110px));width:min(220px,56vw,26vh);z-index:4}
  .cv-deco > svg{display:block;width:100%;filter:drop-shadow(0 8px 0 rgba(59,44,90,.12))}
  .cv-spot{position:absolute;left:50%;translate:-50% 0;bottom:calc(var(--bb) + 40px);width:min(250px,64vw);height:70%;background:linear-gradient(180deg,rgba(255,246,192,0),rgba(255,246,192,.55));clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);z-index:2}
  .cv-shaker{position:absolute;left:calc(50% + 34px);bottom:calc(var(--bb) + 40px + clamp(60px,12vh,110px) + min(220px,56vw,26vh) + 6px);width:54px;rotate:150deg;z-index:6;animation:cvShake .45s ease-in-out infinite alternate}
  @keyframes cvShake{from{rotate:142deg}to{rotate:158deg}}
  .cv-sprinkles{position:absolute;left:50%;translate:-50% 0;bottom:calc(var(--bb) + 40px + clamp(60px,12vh,110px) + min(220px,56vw,26vh) - 20px);width:60px;height:40px;z-index:6}
  .cv-sprinkles i{position:absolute;width:4px;height:10px;border-radius:2px}
  .cv-tap{position:absolute;left:58%;bottom:calc(var(--bb) + 40px + clamp(60px,12vh,110px) + min(220px,56vw,26vh) * .62);z-index:7}
  .cv-tap i{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:4px solid #fff;animation:cvRing 1.3s ease-out infinite}
  @keyframes cvRing{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.4);opacity:0}}
  .cv-tap span{position:absolute;left:-12px;top:-4px;font-size:40px;filter:drop-shadow(0 4px 0 rgba(59,44,90,.2))}
  .cv-babyrider{position:absolute;width:min(62px,16vw);z-index:6}.cv-babyrider svg{width:100%;display:block}
  .cv-hand{position:absolute;font-size:46px;z-index:8;filter:drop-shadow(0 4px 0 rgba(59,44,90,.25));animation:cvPoke 1.2s ease-in-out infinite;pointer-events:none}
  @keyframes cvPoke{50%{translate:0 -10px}}
  .cv-count{position:absolute;left:4%;bottom:calc(var(--bb) + 116px);z-index:6;display:flex;gap:4px;background:#fff;border-radius:999px;padding:5px 8px;box-shadow:0 3px 0 rgba(59,44,90,.12)}
  .cv-count i{width:14px;height:14px;border-radius:50%;background:#F4F0FB;border:2px solid #E8DDF2}
  .cv-count i.on{background:#FFE7A8;border-color:#E2B95A}
  /* Pult */
  .cv-panel{position:relative;z-index:7;width:100%;background:linear-gradient(180deg,#9FE8CB,#6FCFAA);border-top:6px solid #2F9B7A;box-shadow:0 -6px 0 rgba(47,155,122,.2);padding:14px 16px max(16px,var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:10px}
  .cv-panel::before,.cv-panel::after{content:"";position:absolute;top:10px;width:10px;height:10px;border-radius:50%;background:#E9FFF6;border:2px solid #2F9B7A}
  .cv-panel::before{left:12px}.cv-panel::after{right:12px}
  .cv-lights{position:absolute;left:30px;top:16px;display:flex;flex-direction:column;gap:6px}
  .cv-lights i{width:12px;height:12px;border-radius:50%;background:#2F9B7A;border:2px solid #1F6E55}
  .cv-lights i.done{background:#E9FFF6}.cv-lights i.now{background:#FFD54A;box-shadow:0 0 8px 3px rgba(255,213,74,.9)}
  .cv-btnwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
  .cv-bezel{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#F1F4F8,#AEB7C6 70%,#8C97A8);box-shadow:0 6px 0 #5E6B7E,inset 0 3px 0 #fff;display:flex;align-items:center;justify-content:center}
  .cv-big{width:108px;height:108px;border-radius:50%;border:0;background:radial-gradient(circle at 38% 30%,#fff 0 7%,var(--c1) 22%,var(--c2) 70%);box-shadow:0 10px 0 var(--c3),inset 0 -6px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;translate:0 -8px;animation:cvPress 1.2s ease-in-out infinite}
  @keyframes cvPress{0%,60%,100%{translate:0 -8px;box-shadow:0 10px 0 var(--c3),inset 0 -6px 0 rgba(0,0,0,.12)}75%{translate:0 0;box-shadow:0 2px 0 var(--c3),inset 0 -3px 0 rgba(0,0,0,.12)}}
  .cv-big span{font-size:44px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
  .cv-big.red{--c1:#FF8FA8;--c2:#E8455F;--c3:#A8243C;color:#fff}.cv-big.red span{font-size:46px;color:#fff;font-weight:900;margin-left:8px}
  .cv-big.pink{--c1:#FFD0DC;--c2:#FF88A8;--c3:#C9507A}
  .cv-big.fire{--c1:#FFE45C;--c2:#FF8A3D;--c3:#B9451E}
  .cv-plate{font-size:20px;font-weight:900;letter-spacing:.06em;color:#3B2C5A;background:linear-gradient(180deg,#FFF8E7,#F2E2C2);border:3px solid #C9A56A;border-radius:10px;padding:2px 16px;box-shadow:0 3px 0 rgba(90,50,20,.18)}
  .cv-row{display:flex;align-items:center;gap:8px;width:100%;max-width:350px;justify-content:space-between}
  .cv-row b{font-size:22px;width:30px}
  .cv-g{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 0 #2F9B7A;display:flex;align-items:center;justify-content:center}
  .cv-g i{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--c) 45%);border:3px solid var(--b)}
  .cv-k{position:relative;width:50px;height:50px;border-radius:16px;border:0;background:#fff;box-shadow:0 4px 0 #2F9B7A;font-size:25px}
  .cv-g.on,.cv-k.on{box-shadow:0 4px 0 #2F9B7A,0 0 0 4px #FF88A8;translate:0 -2px}
  .cv-k.locked{background:#D6F2E6}.cv-k.locked{filter:grayscale(1);opacity:.7}.cv-k em{position:absolute;top:-6px;right:-6px;font-style:normal;font-size:15px}
  .cv-go{width:100%;max-width:350px;height:54px;border:0;border-radius:999px;background:linear-gradient(180deg,#FF9DB2,#FF7AA2);color:#fff;font:inherit;font-size:20px;font-weight:900;box-shadow:0 6px 0 #C9507A;text-shadow:0 2px 0 rgba(168,36,60,.3)}
  @media (height < 760px){ .cv-bezel{width:116px;height:116px}.cv-big{width:88px;height:88px}.cv-big span{font-size:36px}.cv-plate{font-size:17px}.cv-win{top:20%;width:20%} }
  html,body{height:100%}
  body{margin:0;background:#FFE3EC;font-family:"Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;color:#3B2C5A;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  :root{--pink:#ff7aa2;--pink-dark:#d9507c;--ink:#3b2c5a;--muted:#8b7fb0;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  button{font:inherit;cursor:pointer;touch-action:manipulation}
  #app{position:fixed;inset:0}
  .cvx{margin:0 auto;max-width:460px;overflow:clip!important;box-shadow:0 0 0 1px rgba(201,80,122,.15),0 0 40px rgba(201,80,122,.15)}
  .cv-restart{position:absolute;top:max(10px,var(--safe-t));right:12px;z-index:9;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:22px;font-weight:900;color:#3B2C5A;box-shadow:0 3px 0 rgba(59,44,90,.12)}
  #mach{transition:opacity .3s}
  .cv-scene{overflow:clip}
  .cv-item.lifted{opacity:0}
  .cv-fire{opacity:0;transition:opacity .15s}.cv-oven.blowing .cv-fire{opacity:1}
  .cv-oven.blowing .cv-fips{animation:cvPuff .3s ease-out}
  @keyframes cvPuff{50%{scale:1.08 .94}}
  .cv-touch{position:absolute;left:50%;translate:-50% 0;bottom:calc(var(--bb) + 40px + clamp(60px,12vh,110px));width:min(220px,56vw,26vh);aspect-ratio:1;z-index:8;touch-action:none;cursor:crosshair}
  .cv-tip{margin:0;font-size:14px;font-weight:900;color:#1F6E55}
  .cv-k.nope{animation:cvNope .35s}
  @keyframes cvNope{25%{translate:-5px 0}75%{translate:5px 0}}
  .cv-big:active{translate:0 0!important;box-shadow:0 2px 0 var(--c3)!important}
  .cv-big{cursor:pointer}
  .cv-hand{pointer-events:none}
  .cv-end{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(255,227,236,.85);backdrop-filter:blur(4px);padding:16px;animation:fadeIn .3s}
  @keyframes fadeIn{from{opacity:0}}
  .cv-endbox{width:min(380px,100%);background:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 8px 0 rgba(201,80,122,.2);animation:pop .4s}
  .cv-endbox h2{margin:0;font-size:28px;font-weight:900;color:#E0608A}
  .cv-endbox img{width:150px}
  .cv-endbox p{margin:0;font-size:18px;font-weight:900;text-align:center}
  .cv-endbox .cv-small{font-size:14px;font-weight:700;color:#8b7fb0}
  .cv-plate{display:flex;gap:4px;background:radial-gradient(ellipse at 50% 40%,#fff,#F4F0FB);border:3px solid #E8DDF2;border-radius:999px;padding:6px 12px}
  .cv-plate span{width:52px;display:block}.cv-plate svg{width:100%;display:block}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PIC_PAL = {
  green:  ["#C8F5DE","#7DD9B4","#55BE96","#2F7D63"],

window.cv2 = function(step){
  let scene = "", panel = "", say = "";
  if (step === 1){
    say = "Drück auf START!";
    scene = backdrop + nozzle(false) + oven(false, false, true) + belt(false) + CUPS.map((c, i) => place(6 + i * 10.4, CUP(c))).join("")

  }
  if (step === 3){
    say = "Ab in den Ofen! Drück FEUER!";
    const xs = [98, 88, 62, 51.5, 41];
    scene = backdrop + belt(true) + CUPS.map((c, i) => place(xs[i], i < 2 ? BAKED(c) : CUP(c, true))).join("") + oven(true, true);
    panel = lamps(3) + bigBtn("fire", "🔥", "", "FEUER");
  }
  if (step === 4){
    say = "Tipp auf den Muffin!";
    const xs = [16, 31, 50, 70, 86];
    const exit = `<div class="cv-exit"><svg viewBox="0 0 120 160" preserveAspectRatio="none"><defs><radialGradient id="exF" cx=".2" cy="1" r="1"><stop offset="0" stop-color="#FFE45C"/><stop offset=".45" stop-color="#FF8A3D"/><stop offset="1" stop-color="#7A2E3A"/></radialGradient></defs><path d="M0 160 V20 Q100 10 116 70 V160 Z" fill="#F09A5A" stroke="#B9651E" stroke-width="5"/><path d="M0 160 V64 Q76 60 92 104 V160 Z" fill="#3B2C5A" stroke="#B9651E" stroke-width="4"/><path d="M0 160 V78 Q64 76 80 112 V160 Z" fill="url(#exF)"/></svg></div>`;
    scene = backdrop + exit + `<div class="cv-spot"></div>` + belt(false)
      + CUPS.map((c, i) => i === 2 ? "" : place(xs[i], i < 2 ? deco(c, ["brown","pink"][i], ["bunt","herz"][i], 3 + i * 4) : BAKED(c))).join("")

      + `<svg class="cv-shaker" viewBox="0 0 90 120"><defs><linearGradient id="shk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#F4EADB"/></linearGradient></defs><rect x="18" y="34" width="54" height="74" rx="18" fill="url(#shk)" stroke="#C9946A" stroke-width="5"/><rect x="22" y="20" width="46" height="22" rx="10" fill="#FF88A8" stroke="#C9507A" stroke-width="5"/><g fill="#C9507A"><circle cx="34" cy="28" r="2.6"/><circle cx="45" cy="26" r="2.6"/><circle cx="56" cy="28" r="2.6"/></g><text x="45" y="84" font-size="26" text-anchor="middle">🌈</text><rect x="26" y="44" width="7" height="44" rx="3.5" fill="#fff" opacity=".9"/></svg>`
      + `<div class="cv-sprinkles">${[[10,0,"#FF88A8"],[40,20,"#FFD54A"],[20,50,"#7DD9B4"],[50,70,"#93BFF5"]].map(([x, y, c], i) => `<i style="left:${x}px;top:${y}%;background:${c};rotate:${i * 50}deg"></i>`).join("")}</div>`
      + `<div class="cv-tap"><i></i><span>👆</span></div>`;
    panel = `<div class="cv-row"><b>🍫</b>${["brown","pink","cream","blue","purple"].map((c, i) => `<button class="cv-g${i === 1 ? " on" : ""}" style="--c:${PIC_PAL[c][1]};--b:${PIC_PAL[c][3]}"><i></i></button>`).join("")}</div>
      <div class="cv-row"><b>✨</b>${["🌈","🍫","⭐","💗"].map((e, i) => `<button class="cv-k${i === 0 ? " on" : ""}">${e}</button>`).join("")}<button class="cv-k locked">🍒<em>🔒</em></button></div>
      <button class="cv-go">Nächster Muffin ▶</button>`;
  }
  return {html: `<div class="cvx"><button class="close-x">✕</button>${map(step)}<div class="cv-say">${say}</div><div class="cv-scene">${scene}</div><div class="cv-panel">${panel}</div></div>`, css};
};

let ac = null;
function ctx(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch(e){} return ac; }
function tone(f, d = .15, type = "sine", vol = .2, f2){
  const a = ctx(); if (!a) return; const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
const sfx = {
  click(){ tone(520, .08, "square", .08); },
  go(){ [392, 523, 659].forEach((f, i) => setTimeout(() => tone(f, .14, "triangle", .2), i * 90)); },
  belt(){ for (let i = 0; i < 4; i++) setTimeout(() => tone(140, .05, "square", .05), i * 120); },
  blubb(){ tone(260, .12, "sine", .3, 120); setTimeout(() => tone(300, .12, "sine", .25, 140), 150); },
  fire(){ tone(180, .4, "sawtooth", .08, 600); },
  ding(){ tone(1568, .5, "sine", .2); setTimeout(() => tone(2093, .7, "sine", .15), 120); },
  sprinkle(){ for (let i = 0; i < 3; i++) tone(2200 + Math.random() * 1500, .03, "sine", .05); },
  nope(){ tone(330, .15, "square", .08, 250); },
  yay(){ [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .25, "triangle", .2), i * 100)); }
};

/* ---------- Zustand ---------- */
let S;
function reset(){
  S = {step: 1, busy: false, cups: CUPS.map(c => ({c, dough: false, baked: false, top: null, items: []})),
       pos: CUPS.map((_, i) => 42 - i * 10.4), fill: 0, boost: 0, sel: 0, guss: null, kind: "bunt", hinted: {}};
}

/* ---------- Aufbau ---------- */
function shell(){
  $("app").innerHTML = `<div class="cvx">
    <button class="cv-restart" id="restart" aria-label="Von vorn">↺</button>
    <div id="map"></div><div class="cv-say" id="say"></div>
    <div class="cv-scene" id="scene">${backdrop}<div id="mach"></div>${belt(false)}<div id="cups"></div><div id="fx"></div></div>
    <div class="cv-panel" id="panel"></div></div>`;
  $("restart").onclick = () => { sfx.click(); start(); };
}
const scene = () => $("scene");
function say(t){ const b = $("say"); b.innerHTML = t; b.style.animation = "none"; void b.offsetWidth; b.style.animation = "pop .35s"; }
function setMap(){ $("map").innerHTML = map(Math.min(S.step, 4)); }
function moving(on){ scene().querySelector(".cv-belt").classList.toggle("moving", on); if (on) sfx.belt(); }

/* Förmchen auf dem Band */
function cupSvg(cp){ return cp.top ? window.customMuffinSvg({cup: cp.c, top: cp.top, items: cp.items}) : cp.baked ? BAKED(cp.c) : CUP(cp.c, cp.dough); }
function drawCups(){
  $("cups").innerHTML = S.cups.map((cp, i) => `<div class="cv-item${S.step === 2 && i === S.fill ? " wobble glow" : ""}${S.step === 4 && i === S.sel ? " lifted" : ""}" id="cup${i}" style="left:${S.pos[i]}%">${cupSvg(cp)}<i class="cv-shadow"></i></div>`).join("");
}
function moveCups(add, ms = 700){
  S.cups.forEach((_, i) => { S.pos[i] += add; const el = $("cup" + i); el.style.transition = `left ${ms}ms linear`; el.style.left = S.pos[i] + "%"; });
  moving(true); return wait(ms).then(() => moving(false));
}
function hand(where){ $("fx").querySelectorAll(".cv-hand").forEach(h => h.remove()); if (where) $("fx").insertAdjacentHTML("beforeend", `<div class="cv-hand" style="${where}">👆</div>`); }

/* ---------- Schritte ---------- */
function step1(){
  S.step = 1; setMap(); say("Drück auf START!");
  $("mach").innerHTML = nozzle(false) + oven(false, false, true) + `<div class="cv-babyrider" style="left:3%;bottom:calc(var(--bb) + 92px)">${window.BB_BABY}</div>`;
  drawCups();
  $("panel").innerHTML = lamps(1) + bigBtn("red", "▶", "", "START") + `<div class="cv-hand" style="left:calc(50% + 14px);bottom:calc(max(16px,var(--safe-b)) + 44px)">👆</div>`;
  $("panel").querySelector(".cv-big").onclick = async () => {
    if (S.busy) return; S.busy = true; sfx.go();
    $("panel").querySelector(".cv-hand")?.remove();
    say("Los geht’s! 🚚");
    await moveCups(8, 900);
    S.busy = false; step2();
  };
}
function counter(){ return `<div class="cv-count">${[0,1,2,3,4].map(i => `<i class="${S.cups[i].dough ? "on" : ""}"></i>`).join("")}</div>`; }
function step2(){
  S.step = 2; setMap(); say("Tipp auf TEIG!");
  $("mach").innerHTML = nozzle(false) + oven(false, false, true) + counter();
  drawCups();
  $("panel").innerHTML = lamps(2) + bigBtn("pink", "🧁", "", "TEIG") + (S.fill === 0 ? `<div class="cv-hand" style="left:calc(50% + 14px);bottom:calc(max(16px,var(--safe-b)) + 44px)">👆</div>` : "");
  $("panel").querySelector(".cv-big").onclick = async () => {
    if (S.busy) return; S.busy = true;
    $("panel").querySelector(".cv-hand")?.remove();
    $("mach").innerHTML = nozzle(true, true) + oven(false, false, true) + counter();
    sfx.blubb();
    await wait(650);
    S.cups[S.fill].dough = true; drawCups();
    $("mach").innerHTML = nozzle(false) + oven(false, false, true) + counter();
    say(["Blubb! 😋", "Noch einer! 🧁", "Mmmh, Teig! 😍", "Fast voll! 🙌", "Alle voll! 🎉"][S.fill]);
    if (S.fill < 4){
      await wait(250); await moveCups(10.4, 650);
      S.fill++; drawCups(); S.busy = false;
      say(`Tipp auf TEIG! (${S.fill + 1} von 5)`);
    } else {
      await wait(500);
      $("mach").style.opacity = 0; await moveCups(14, 900); $("mach").style.opacity = 1;
      S.busy = false; step3();
    }
  };
}
let raf = 0;
function step3(){
  S.step = 3; setMap(); say("Ab in den Ofen! Drück FEUER! 🔥");
  S.pos = [70, 59.6, 49.2, 38.8, 28.4];
  $("mach").innerHTML = "";
  drawCups();
  scene().insertAdjacentHTML("beforeend", `<div id="ovenLayer">${oven(true, true)}</div>`);
  $("panel").innerHTML = lamps(3) + bigBtn("fire", "🔥", "", "FEUER") + `<div class="cv-hand" style="left:calc(50% + 14px);bottom:calc(max(16px,var(--safe-b)) + 44px)">👆</div><p class="cv-tip">Ohne Feuer backt es langsam</p>`;
  const ov = scene().querySelector(".cv-oven");
  $("panel").querySelector(".cv-big").onclick = () => {
    $("panel").querySelector(".cv-hand")?.remove();
    S.boost = Math.min(S.boost + 14, 40); sfx.fire();
    ov.classList.remove("blowing"); void ov.offsetWidth; ov.classList.add("blowing");
    if (Math.random() < .35) say(["Fffffff! 🔥", "Heißer! 🔥🔥", "Fips pustet! 🐉🔥"][Math.random() * 3 | 0]);
  };
  moving(true);
  let last = performance.now(), dinged = false;
  const tick = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    S.boost = Math.max(0, S.boost - 22 * dt);
    if (S.boost < 1) ov.classList.remove("blowing");
    const v = 5 + S.boost;
    S.cups.forEach((cp, i) => {
      S.pos[i] += v * dt;
      if (!cp.baked && S.pos[i] > 64){ cp.baked = true; const el = $("cup" + i); el.firstElementChild.outerHTML = BAKED(cp.c); }
      const el = $("cup" + i); el.style.transition = "none"; el.style.left = S.pos[i] + "%";
    });
    if (S.pos[4] >= 104){
      moving(false); cancelAnimationFrame(raf);
      if (!dinged){ dinged = true; sfx.ding(); say("Ding! Alle gebacken! 🔔"); setTimeout(() => { $("ovenLayer")?.remove(); step4(); }, 1100); }
      return;
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
/* ---------- Verzieren ---------- */
const XS = [16, 31, 50, 70, 86];
const EXIT = `<div class="cv-exit"><svg viewBox="0 0 120 160" preserveAspectRatio="none"><defs><radialGradient id="exF" cx=".2" cy="1" r="1"><stop offset="0" stop-color="#FFE45C"/><stop offset=".45" stop-color="#FF8A3D"/><stop offset="1" stop-color="#7A2E3A"/></radialGradient></defs><path d="M0 160 V20 Q100 10 116 70 V160 Z" fill="#F09A5A" stroke="#B9651E" stroke-width="5"/><path d="M0 160 V64 Q76 60 92 104 V160 Z" fill="#3B2C5A" stroke="#B9651E" stroke-width="4"/><path d="M0 160 V78 Q64 76 80 112 V160 Z" fill="url(#exF)"/></svg></div>`;
const SHAKER = k => `<svg class="cv-shaker" viewBox="0 0 90 120"><defs><linearGradient id="shk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#F4EADB"/></linearGradient></defs><rect x="18" y="34" width="54" height="74" rx="18" fill="url(#shk)" stroke="#C9946A" stroke-width="5"/><rect x="22" y="20" width="46" height="22" rx="10" fill="#FF88A8" stroke="#C9507A" stroke-width="5"/><g fill="#C9507A"><circle cx="34" cy="28" r="2.6"/><circle cx="45" cy="26" r="2.6"/><circle cx="56" cy="28" r="2.6"/></g><text x="45" y="84" font-size="26" text-anchor="middle">${k}</text><rect x="26" y="44" width="7" height="44" rx="3.5" fill="#fff" opacity=".9"/></svg>`;
const KINDS = [["bunt","🌈",0],["schoko","🍫",0],["stern","⭐",10],["herz","💗",20],["kirsche","🍒",35]];
const GUSS = ["brown","pink","cream","blue","purple"];
function step4(){
  S.step = 4; setMap(); S.sel = 0;
  S.pos = XS.slice();
  $("mach").innerHTML = EXIT + `<div class="cv-spot"></div><div class="cv-lift"></div><div class="cv-deco" id="big"></div><div id="shakerBox"></div><div class="cv-touch" id="touch"></div>`;
  S.cups.forEach((cp, i) => { cp.baked = true; });
  $("panel").innerHTML = `<div class="cv-row" id="gussRow"><b>🍫</b>${GUSS.map(c => `<button class="cv-g" data-g="${c}" style="--c:${PIC_PAL[c][1]};--b:${PIC_PAL[c][3]}" aria-label="Guss ${c}"><i></i></button>`).join("")}</div>
    <div class="cv-row" id="kindRow"><b>✨</b>${KINDS.map(([k, e, need]) => `<button class="cv-k${need > STARS ? " locked" : ""}" data-k="${k}">${e}${need > STARS ? "<em>🔒</em>" : ""}</button>`).join("")}</div>
    <button class="cv-go" id="next">Nächster Muffin ▶</button>`;
  $("gussRow").onclick = e => { const b = e.target.closest("button"); if (!b) return; const cp = S.cups[S.sel]; cp.top = b.dataset.g; sfx.click(); bigDraw(); rows(); if (!S.hinted.tap){ say("Jetzt tipp auf den Muffin! ✨"); tapHint(true); } };
  $("kindRow").onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = KINDS.find(x => x[0] === b.dataset.k);
    if (k[2] > STARS){ sfx.nope(); say(`🎧 ✅ ×${k[2] - STARS} ➜ ${k[1]}`); b.classList.remove("nope"); void b.offsetWidth; b.classList.add("nope"); return; }
    S.kind = k[0]; sfx.click(); rows(); $("shakerBox").innerHTML = SHAKER(k[1]); };
  $("next").onclick = nextMuffin;
  const t = $("touch"); let down = false, last = 0;
  t.addEventListener("pointerdown", e => { down = true; t.setPointerCapture(e.pointerId); sprinkle(e); });
  t.addEventListener("pointermove", e => { if (down && Date.now() - last > 60){ last = Date.now(); sprinkle(e); } });
  ["pointerup","pointercancel"].forEach(n => t.addEventListener(n, () => down = false));
  selectCup();
}
function rows(){
  const cp = S.cups[S.sel];
  document.querySelectorAll("#gussRow .cv-g").forEach(b => b.classList.toggle("on", b.dataset.g === cp.top));
  document.querySelectorAll("#kindRow .cv-k").forEach(b => b.classList.toggle("on", b.dataset.k === S.kind));
  $("next").textContent = S.sel === 4 ? "Fertig – ab zu Fips! 🐉" : "Nächster Muffin ▶";
}
function bigDraw(){ const cp = S.cups[S.sel]; $("big").innerHTML = cupSvg(cp); }
function tapHint(on){ $("fx").innerHTML = on ? `<div class="cv-tap"><i></i><span>👆</span></div>` : ""; }
function selectCup(){
  drawCups(); bigDraw(); rows();
  $("shakerBox").innerHTML = SHAKER(KINDS.find(k => k[0] === S.kind)[1]);
  const cp = S.cups[S.sel];
  if (!cp.top){ say(S.sel === 0 ? "Wähl einen Guss! 👇" : `Muffin ${S.sel + 1} von 5: Welcher Guss? 👇`); tapHint(false); }
  else { say("Tipp auf den Muffin! ✨"); tapHint(!S.hinted.tap); }
}
function sprinkle(ev){
  const cp = S.cups[S.sel];
  if (!cp.top){ cp.top = "pink"; bigDraw(); rows(); }
  const svg = $("big").querySelector("svg"), top = svg && svg.querySelector(".k-top"); if (!top) return;
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const k = S.kind, n = k === "kirsche" ? 1 : k === "herz" || k === "stern" ? 2 : 4;
  if (k === "kirsche" && cp.items.filter(i => i.t === "kirsche").length >= 3) return;
  let added = 0;
  for (let i = 0; i < n * 3 && added < n; i++){
    const x = p.x + (n > 1 ? Math.random() * 10 - 5 : 0), y = p.y + (n > 1 ? Math.random() * 7 - 3.5 : 0);
    const pt = svg.createSVGPoint(); pt.x = x; pt.y = y;
    if (!top.isPointInFill(pt) || y > 31) continue;
    const c = k === "bunt" ? ["#FF88A8","#FFD54A","#7DD9B4","#93BFF5","#C0A4F0","#FFB062"][Math.random() * 6 | 0]
            : k === "schoko" ? ["#4A2E3A","#6E4429","#5A3A2E"][Math.random() * 3 | 0]
            : k === "stern" ? ["#FFE45C","#FFF6C0","#FFD54A"][Math.random() * 3 | 0] : ["#FF88A8","#E8455F","#FFB3C8"][Math.random() * 3 | 0];
    cp.items.push({t: k, x: +x.toFixed(1), y: +y.toFixed(1), r: Math.round(Math.random() * 180), c}); added++;
  }
  if (added){ bigDraw(); sfx.sprinkle(); if (!S.hinted.tap){ S.hinted.tap = true; tapHint(false); say("Super! ✨ Noch mehr? Oder weiter ▶"); } }
}
async function nextMuffin(){
  if (S.busy) return; S.busy = true; sfx.click();
  if (S.sel < 4){ S.sel++; selectCup(); S.busy = false; return; }
  await wait(200); S.busy = false; step5();
}
/* ---------- Ende: 5 Muffins für Fips ---------- */
function step5(){
  S.step = 5; sfx.yay();
  $("app").insertAdjacentHTML("beforeend", `<div class="cv-end">
    <div class="cv-endbox">
      <h2>Fertig! 🎉</h2>
      <img src="img/fips-jubel.svg" alt="Fips freut sich">
      <p>„5 Muffins für mich? Ab zur Party!“</p>
      <div class="cv-plate">${S.cups.map(cp => `<span>${cupSvg(cp)}</span>`).join("")}</div>
      <p class="cv-small">In der App geht es jetzt auf die Party-Wiese – dort fütterst du diese 5 Muffins an Fips.</p>
      <button class="cv-go" id="again">🔄 Nochmal backen</button>
    </div></div>`);
  $("again").onclick = () => { sfx.click(); start(); };
}
function start(){ cancelAnimationFrame(raf); reset(); shell(); step1(); }
start();
})();

</script>
</body>
</html>
