<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F6D6E4">
<link rel="icon" href="favicon.svg">
<!-- Muffin-Fabrik: spielbarer Prototyp für die Muffin-Party. Alles wird direkt angetippt oder gezogen:
     Förmchen aufs Band ziehen → Hebel → Teigmaschine antippen → Tunnelofen → mit Flaschen und Streuern verzieren → Klingel.
     Eigenständige Seite – Palette und Muffin-Zeichnung sind aus js/pictures.js und js/egg.js übernommen. -->
<title>Muffin-Fabrik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#F6D6E4;font-family:"Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;color:#3B2C5A;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  :root{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
  button{font:inherit;cursor:pointer;touch-action:manipulation}
  #app{position:fixed;inset:0}
  .fx3{position:absolute;inset:0;margin:0 auto;max-width:460px;overflow:clip;background:#FFE6EF;box-shadow:0 0 40px rgba(201,80,122,.2)}
  #sc{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 70% at 50% 48%,transparent 60%,rgba(94,46,74,.2))}
  .top{position:absolute;left:0;right:0;top:max(10px,var(--safe-t));display:flex;justify-content:center;padding:0 56px 0 12px;pointer-events:none}
  #map{display:flex;align-items:flex-start;background:rgba(255,255,255,.92);border-radius:24px;padding:6px 12px 4px;box-shadow:0 4px 0 rgba(94,46,74,.1),0 8px 20px rgba(94,46,74,.08)}
  #map > div{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px}
  #map span{width:34px;height:34px;border-radius:50%;background:#F4F0FB;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;filter:grayscale(1);opacity:.55}
  #map small{font-size:10px;font-weight:900;color:#B9A9D9}
  #map .done span{background:linear-gradient(180deg,#7DD9B4,#55BE96);color:#fff;filter:none;opacity:1;box-shadow:0 3px 0 #2F9B7A}#map .done small{color:#2F9B7A}
  #map .now span{background:linear-gradient(180deg,#FFD0DC,#FF88A8);filter:none;opacity:1;box-shadow:0 3px 0 #C9507A,0 0 0 4px #FFE3EC}#map .now small{color:#E0608A}
  #map > i{width:10px;height:5px;margin-top:15px;border-radius:3px;background:#E8DDF2}
  #restart{position:absolute;right:12px;top:0;width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:22px;font-weight:900;color:#3B2C5A;box-shadow:0 3px 0 rgba(94,46,74,.15);pointer-events:auto}
  .say{position:absolute;left:50%;top:calc(max(10px,var(--safe-t)) + 64px);translate:-50% 0;max-width:calc(100% - 28px);background:#fff;border-radius:22px;padding:8px 18px;font-size:17px;font-weight:900;text-align:center;box-shadow:0 5px 0 rgba(94,46,74,.1),0 10px 24px rgba(94,46,74,.1);pointer-events:none;width:max-content}
  .say.pop{animation:pop .35s}
  @keyframes pop{0%{scale:.7}70%{scale:1.08}100%{scale:1}}
  @media (max-width:380px){.say{font-size:16px}}
  /* SVG-Animationen */
  .moving .belt-lines{animation:dash .35s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-24}}
  .hot{animation:glow 1s ease-in-out infinite alternate}
  @keyframes glow{from{filter:drop-shadow(0 0 0 rgba(255,213,74,0))}to{filter:drop-shadow(0 0 7px rgba(255,213,74,1)) drop-shadow(0 0 2px #fff)}}
  .hint,.fallbit,.pourS,#streams,#slot{pointer-events:none}
  .hint .ring{transform-box:fill-box;transform-origin:center;animation:ring 1.3s ease-out infinite}
  .hint .r2{animation-delay:.65s}
  @keyframes ring{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.5);opacity:0}}
  .hint .handE{animation:poke 1.1s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(59,44,90,.25))}
  @keyframes poke{50%{transform:translateY(-9px)}}
  .bub{animation:bub 2.2s ease-in infinite}.bub.b2{animation-delay:.8s}.bub.b3{animation-delay:1.5s}
  @keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-50px);opacity:0}}
  .flap{transform-box:fill-box;transform-origin:50% 0;animation:flap 1.2s ease-in-out infinite alternate}
  .flap.f1{animation-delay:-.3s}.flap.f2{animation-delay:-.6s}.flap.f3{animation-delay:-.9s}
  @keyframes flap{from{rotate:-4deg}to{rotate:7deg}}
  .moving .flap{animation-duration:.35s}
  .flicker{animation:flick .5s ease-in-out infinite alternate}
  @keyframes flick{to{opacity:.65}}
  .smoke text{animation:smoke 2.6s ease-out infinite}.smoke text:nth-child(2){animation-delay:1.3s}
  @keyframes smoke{0%{transform:translate(0,0);opacity:0}25%{opacity:1}100%{transform:translate(-14px,-60px);opacity:0}}
  .slotmark{animation:slot 1s ease-in-out infinite alternate}
  @keyframes slot{to{opacity:.45}}
  .popin{transform-box:fill-box;transform-origin:50% 100%;animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes popin{0%{transform:scale(.85,.8)}100%{transform:scale(1)}}
  .fallbit{animation:fallb .42s ease-in forwards}
  @keyframes fallb{to{transform:translateY(var(--d));opacity:0}}
  .pourS{stroke-dasharray:240;stroke-dashoffset:240;animation:pourA .35s ease-out forwards}
  @keyframes pourA{to{stroke-dashoffset:0}}
  .nope{animation:nope .35s}
  @keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .stream{animation:streamA .4s linear infinite}
  @keyframes streamA{50%{opacity:.85}}
  /* Fertig */
  .end{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(255,227,236,.85);backdrop-filter:blur(4px);padding:16px;animation:fadeIn .3s}
  @keyframes fadeIn{from{opacity:0}}
  .endbox{width:min(380px,100%);background:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 8px 0 rgba(201,80,122,.2);animation:pop .4s}
  .endbox h2{margin:0;font-size:28px;font-weight:900;color:#E0608A}
  .endbox img{width:150px}
  .endbox p{margin:0;font-size:18px;font-weight:900;text-align:center}
  .endbox .small{font-size:14px;font-weight:700;color:#8b7fb0}
  .plate{display:flex;gap:4px;background:radial-gradient(ellipse at 50% 40%,#fff,#F4F0FB);border:3px solid #E8DDF2;border-radius:999px;padding:6px 12px}
  .plate span{width:52px;display:block}.plate svg{width:100%;display:block}
  #again{border:0;border-radius:999px;background:linear-gradient(180deg,#FF9DB2,#FF7AA2);color:#fff;font-size:20px;font-weight:900;padding:14px 26px;box-shadow:0 6px 0 #C9507A}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PIC_PAL = {
  green:  ["#C8F5DE","#7DD9B4","#55BE96","#2F7D63"],
  leaf:   ["#DDF7B8","#96D965","#66B53C","#3E7D22"],
  blue:   ["#DCEBFF","#93BFF5","#6295E0","#2F5FA8"],
  water:  ["#E3F7FF","#8FD6F5","#4FB0E0","#2A7AA8"],
  ice:    ["#F4FDFF","#BDEBFA","#7FD0EE","#3A93B8"],
  yellow: ["#FFF7CC","#FFDB5E","#F5B82E","#B07A12"],
  yolk:   ["#FFEBA8","#FFC23A","#F59E1B","#B8730E"],
  orange: ["#FFE2BD","#FFB062","#F28C2E","#B5601A"],
  red:    ["#FFD3D9","#FF7A8E","#E8455F","#A8243C"],
  pink:   ["#FFE6EE","#FFB3C8","#FF88A8","#C9507A"],
  purple: ["#EFE5FF","#C0A4F0","#9474D8","#5E449E"],
  brown:  ["#F2D5B5","#C9946A","#A8714A","#6E4429"],
  wood:   ["#FFE8C6","#EDBA80","#D49756","#8F5A2B"],
  metal:  ["#FFFFFF","#DCE2EC","#AEB7C6","#5B6478"],
  storm:  ["#E4E6F0","#AEB3C8","#878EA8","#4E5578"],
  white:  ["#FFFFFF","#FFFFFF","#E9E4F4","#8B7FB0"],
  cream:  ["#FFFDF5","#F7EBD3","#E2CBA2","#A88B5E"],
  skin:   ["#FFF2E8","#FFD6BA","#F5B690","#B87452"],
  gold:   ["#FFF6BF","#FFD54A","#E8A800","#A87500"],
  dark:   ["#9A8CC0","#5E5088","#3B2C5A","#2A1F4A"],
};

const pf  = k => `fill="url(#pg-${k})" stroke="${PIC_PAL[k][3]}"`;   // Fläche mit Verlauf + Umriss
const pln = k => PIC_PAL[k][3];                                      // Umrissfarbe

/* Verläufe einmal ins Dokument einfügen */
(function(){
  const g = Object.entries(PIC_PAL).map(([k,[a,b,c]]) =>
    `<radialGradient id="pg-${k}" cx=".36" cy=".28" r=".85"><stop offset="0" stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`).join("");
  document.body.insertAdjacentHTML("afterbegin",
    `<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>${g}</defs></svg>`);
})();


function kItem(it){
  const {t, x, y, r, c} = it;
  if (t === "bunt" || t === "schoko") return `<rect x="${x - 2.2}" y="${y - .8}" width="4.4" height="1.6" rx=".8" fill="${c}" transform="rotate(${r} ${x} ${y})"/>`;
  if (t === "stern") return `<path transform="translate(${x} ${y}) rotate(${r}) scale(.55)" d="M0 -5 L1.4 -1.6 5 -1.5 2.2 .9 3.1 4.6 0 2.5 -3.1 4.6 -2.2 .9 -5 -1.5 -1.4 -1.6 Z" fill="${c}" stroke="#A87500" stroke-width=".6"/>`;
  if (t === "punkte") return `<g><circle cx="${x}" cy="${y}" r="1.7" fill="${c}"/><circle cx="${x - .5}" cy="${y - .55}" r=".5" fill="#fff" opacity=".7"/></g>`;
  if (t === "perle") return `<g><circle cx="${x}" cy="${y}" r="1.15" fill="#E9EEF6" stroke="#AEB7C6" stroke-width=".35"/><circle cx="${x - .35}" cy="${y - .4}" r=".35" fill="#fff"/></g>`;
  if (t === "blume") return `<g transform="translate(${x} ${y}) rotate(${r})">${[0,72,144,216,288].map(a => `<ellipse rx="1.5" ry="2.3" cy="-2" transform="rotate(${a})" fill="${c}"/>`).join("")}<circle r="1.3" fill="#FFD54A"/></g>`;
  if (t === "kerze") return `<g transform="translate(${x} ${y}) scale(.75)"><rect x="-2.2" y="-15" width="4.4" height="15" rx="1.2" fill="#FFF6F8" stroke="#E86A8E" stroke-width=".8"/><path d="M-2.2 -11 L2.2 -13.5 M-2.2 -6 L2.2 -8.5 M-2.2 -1 L2.2 -3.5" stroke="#FF88A8" stroke-width="1.2"/><path d="M0 -15 V-17" stroke="#4A2E3A" stroke-width=".7"/><path class="k-flame" d="M0 -23.5 Q3 -19.5 0 -16.8 Q-3 -19.5 0 -23.5 Z" fill="#FFB13B"/><path d="M0 -21.5 Q1.4 -19 0 -17.6 Q-1.4 -19 0 -21.5 Z" fill="#FFF6C0"/></g>`;
  if (t === "herz") return `<path transform="translate(${x} ${y}) rotate(${r}) scale(.5)" d="M0 4 C-7 -1 -5 -7 0 -3 C5 -7 7 -1 0 4 Z" fill="${c}"/>`;
  return `<g transform="translate(${x} ${y})"><path d="M0 -4 Q2 -10 7 -11" fill="none" stroke="#3E7D22" stroke-width="1.6"/><circle r="4.5" fill="url(#pg-red)" stroke="#A8243C" stroke-width="1.5"/><ellipse cx="-1.5" cy="-1.6" rx="1.3" ry=".9" fill="#fff" opacity=".8"/></g>`;
}
function customMuffinSvg(m){
  return `<svg viewBox="0 0 60 60"><g stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M12 31 L48 31 L44 55 Q30 58 16 55 Z" ${pf(m.cup)}/>
    <path d="M21 32 L22 55 M30 32 V56 M39 32 L38 55" stroke="${pln(m.cup)}" stroke-width="1.8" fill="none"/>
    <path class="k-top" d="M8 33 Q5 12 30 9 Q55 12 52 33 Q46 37 40 33 Q35 38 30 33 Q25 38 20 33 Q14 37 8 33 Z" ${pf(m.top)}/>
    <ellipse cx="18" cy="18" rx="5" ry="2.5" transform="rotate(-30 18 18)" fill="#fff" opacity=".55"/>
    <g stroke="none">${m.items.filter(i => i.t !== "kirsche" && i.t !== "kerze").map(kItem).join("")}${m.items.filter(i => i.t === "kirsche" || i.t === "kerze").map(kItem).join("")}</g>
  </g></svg>`;
}

</script>
<script>
/* ================= Muffin-Fabrik 3 – alles direkt antippen und ziehen ================= */
(function(){
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const STARS = 28;   // Beispielkind: 28 richtige Antworten → Kirschen noch gesperrt (ab 35)

/* ---------- Geräusche ---------- */
let ac = null;
function actx(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch(e){} return ac; }
function tone(f, d = .15, type = "sine", vol = .2, f2){
  const a = actx(); if (!a) return; const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
const sfx = {
  pick(){ tone(660, .07, "triangle", .15, 880); },
  drop(){ tone(220, .1, "sine", .3, 140); },
  lever(){ tone(160, .12, "square", .08, 90); setTimeout(() => tone(500, .08, "triangle", .15), 120); },
  belt(){ for (let i = 0; i < 4; i++) setTimeout(() => tone(140, .05, "square", .04), i * 110); },
  squirt(){ tone(500, .25, "sawtooth", .05, 180); setTimeout(() => { tone(260, .12, "sine", .3, 120); setTimeout(() => tone(300, .12, "sine", .25, 140), 140); }, 250); },
  ding(){ tone(1568, .5, "sine", .2); setTimeout(() => tone(2093, .7, "sine", .15), 120); },
  pour(){ tone(300, .5, "sine", .12, 200); },
  sprinkle(){ for (let i = 0; i < 3; i++) tone(2200 + Math.random() * 1500, .03, "sine", .05); },
  nope(){ tone(330, .15, "square", .08, 250); },
  yay(){ [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .25, "triangle", .2), i * 100)); }
};

/* ---------- Förmchen und Muffins (gleicher Bildausschnitt für alle) ---------- */
const VB = 'viewBox="4 4 52 56"';
const CUP = (c, dough) => `<svg ${VB}><g stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">${dough ? `<path d="M13 33 Q12 18 30 17 Q48 18 47 33 Z" fill="#FFE7A8" stroke="#E2B95A"/><path d="M30 17 Q33 11 29 8" fill="none" stroke="#E2B95A" stroke-width="3"/><ellipse cx="22" cy="24" rx="4" ry="2" fill="#fff" opacity=".6"/>` : ""}<path d="M12 31 L48 31 L44 55 Q30 58 16 55 Z" ${pf(c)}/><path d="M21 32 L22 55 M30 32 V56 M39 32 L38 55" stroke="${pln(c)}" stroke-width="1.8" fill="none"/><path d="M15 34 L18 52" stroke="#fff" stroke-width="2.4" opacity=".55"/></g></svg>`;
const BAKED = c => `<svg ${VB}><g stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 31 L48 31 L44 55 Q30 58 16 55 Z" ${pf(c)}/><path d="M21 32 L22 55 M30 32 V56 M39 32 L38 55" stroke="${pln(c)}" stroke-width="1.8" fill="none"/><path d="M8 33 Q5 12 30 9 Q55 12 52 33 Q46 37 40 33 Q35 38 30 33 Q25 38 20 33 Q14 37 8 33 Z" fill="url(#bakedG)" stroke="#A8714A"/><ellipse cx="20" cy="19" rx="5" ry="2.4" transform="rotate(-30 20 19)" fill="#fff" opacity=".55"/></g></svg>`;
function cupSvg(cp){
  if (cp.top) return customMuffinSvg({cup: cp.c, top: cp.top, items: cp.items}).replace(/viewBox="[^"]*"/, VB);
  return cp.baked ? BAKED(cp.c) : CUP(cp.c, cp.dough);
}
const nest = (svg, x, y, w, h, extra = "") => svg.replace("<svg ", `<svg x="${x}" y="${y}" width="${w}" height="${h}" overflow="visible" ${extra} `);
const CW = 46, CH = 50, BELT = 518;     // Förmchen-Größe und Oberkante des Bandes (Welt-Koordinaten)

/* ---------- Kulisse (eine lange Fabrik, die Kamera fährt mit) ---------- */
const DEFS = `<defs>
  <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6D6E4"/><stop offset=".55" stop-color="#FFEFF5"/><stop offset="1" stop-color="#FFE6EF"/></linearGradient>
  <pattern id="dotsP" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="2.2" fill="#F7C3D5"/></pattern>
  <linearGradient id="wainG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7F3E7"/><stop offset="1" stop-color="#BDE8D6"/></linearGradient>
  <pattern id="wainP" width="44" height="10" patternUnits="userSpaceOnUse"><rect width="22" height="10" fill="#fff" opacity=".35"/></pattern>
  <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4F7"/><stop offset="1" stop-color="#F3C9D8"/></linearGradient>
  <pattern id="tileP" width="48" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#FFD6E3"/><rect x="24" y="12" width="24" height="12" fill="#FFD6E3"/></pattern>
  <linearGradient id="beltTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9C8FD0"/><stop offset="1" stop-color="#6E5FA8"/></linearGradient>
  <linearGradient id="beltFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8EDD2"/><stop offset=".5" stop-color="#7DD9B4"/><stop offset="1" stop-color="#55BE96"/></linearGradient>
  <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8C97A8"/><stop offset=".4" stop-color="#EEF2F7"/><stop offset="1" stop-color="#9AA5B6"/></linearGradient>
  <linearGradient id="mintV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55BE96"/><stop offset=".4" stop-color="#B8F0DA"/><stop offset="1" stop-color="#5EC79F"/></linearGradient>
  <linearGradient id="woodG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C894"/><stop offset="1" stop-color="#C9894E"/></linearGradient>
  <radialGradient id="glassG" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#F7D9E6" stop-opacity=".55"/></radialGradient>
  <linearGradient id="doughG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3CC"/><stop offset="1" stop-color="#F2C873"/></linearGradient>
  <linearGradient id="pinkV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC4D4"/><stop offset=".55" stop-color="#FF88A8"/><stop offset="1" stop-color="#E8608A"/></linearGradient>
  <radialGradient id="redBall" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFD0DA"/><stop offset=".35" stop-color="#FF5A78"/><stop offset="1" stop-color="#B8213F"/></radialGradient>
  <radialGradient id="bakedG" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#FFE0A8"/><stop offset="1" stop-color="#D99A52"/></radialGradient>
  <linearGradient id="ovBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC994"/><stop offset="1" stop-color="#E88A4A"/></linearGradient>
  <pattern id="brickP" width="30" height="16" patternUnits="userSpaceOnUse"><path d="M0 15.5 H30 M15 0 V8 M0 8 H30 M2 8 V16" stroke="#C9682E" stroke-width="1.5" opacity=".45" fill="none"/></pattern>
  <linearGradient id="ovIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A1F2E"/><stop offset=".55" stop-color="#C9451E"/><stop offset="1" stop-color="#FFC24A"/></linearGradient>
  <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".2"/><stop offset=".56" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="lightPool" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#FFF6D0" stop-opacity=".75"/><stop offset="1" stop-color="#FFF6D0" stop-opacity="0"/></radialGradient>
  <radialGradient id="skyG" cx=".5" cy="0" r="1.1"><stop offset="0" stop-color="#7EC8FF"/><stop offset="1" stop-color="#DDF2FF"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#5E2E4A" flood-opacity=".22"/></filter>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur2"><feGaussianBlur stdDeviation="1.2"/></filter>

function windowSvg(x, y){

function setCam(x){ S && (S.cam = x); world.setAttribute("transform", `translate(${-x} 0)`); }
function tween(ms, fn, ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2){
  return new Promise(res => { const t0 = performance.now(); const f = now => { const t = Math.min(1, (now - t0) / ms); fn(ease(t)); if (t < 1) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
}

  const start = S.cups.map(c => c.x); beltMoving(true);

/* ---------- Schritt 1: Förmchen aufs Band setzen ---------- */
const SLOTS = [256, 208, 160, 112, 64];
function step1(){
  S.step = 1; setMap(); say("Zieh ein Förmchen aufs Band! 👇");
  showSlot(); hint(58, 380);
  document.querySelectorAll(".stack").forEach(st => st.addEventListener("pointerdown", e => stackDown(e, st)));
  $("lever").addEventListener("pointerdown", leverDown);
  $("tank").addEventListener("pointerdown", tankTap);
}
function showSlot(){
  const n = S.cups.length;
  $("slot").innerHTML = n < 5 && S.step === 1 ? `<g transform="translate(${SLOTS[n]} ${BELT})" class="slotmark"><path d="M-20 -26 L20 -26 L17 -2 Q0 1 -17 -2 Z" fill="rgba(255,255,255,.55)" stroke="#fff" stroke-width="3" stroke-dasharray="5 4"/><text y="-8" text-anchor="middle" font-size="14" font-weight="900" fill="#C9507A">${n + 1}</text></g>` : "";
}
function stackDown(e, st){
  if (S.step !== 1 || S.busy || S.cups.length >= 5) return;
  e.preventDefault(); sfx.pick(); hint(null);
  const c = st.dataset.c, sx = +st.dataset.x;
  const p0 = toWorld(e); let moved = false;
  const d = $("drag"); d.innerHTML = `<g id="ghost">${nest(CUP(c), -CW / 2, -CH, CW, CH)}</g>`;
  const gh = $("ghost"); let gx = sx, gy = 400;
  const put = () => gh.setAttribute("transform", `translate(${gx} ${gy}) scale(1.15)`); put();
  const move = ev => { const p = toWorld(ev); if (Math.hypot(p.x - p0.x, p.y - p0.y) > 6) moved = true; gx = p.x; gy = p.y + 24; put(); };
  const up = async ev => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
    const p = toWorld(ev), onBelt = !moved || (p.y > 430 && p.y < 600 && p.x > 10 && p.x < 300);
    if (!onBelt){ const fx = gx, fy = gy; await tween(250, t => { gx = fx + (sx - fx) * t; gy = fy + (400 - fy) * t; put(); }); d.innerHTML = ""; say("Aufs Band ziehen! 👇"); return; }
    S.busy = true;
    const n = S.cups.length, tx = SLOTS[n], ty = BELT, fx = gx, fy = gy;
    await tween(320, t => { gx = fx + (tx - fx) * t; gy = fy + (ty - fy) * t - Math.sin(t * Math.PI) * 50; put(); });
    d.innerHTML = ""; sfx.drop();
    const cp = {i: n, c, x: tx, y: BELT, dough: false, baked: false, top: null, items: [], sy: 1};
    S.cups.push(cp); drawCup(cp);
    await tween(220, t => { cp.sy = 1 - Math.sin(t * Math.PI) * .18; place(cp); });
    S.busy = false; showSlot();
    if (S.cups.length < 5) say(["Super! Noch eins! 🧁", "Toll! Und noch eins!", "Prima! Zwei fehlen noch!", "Eins noch! 🙌"][n]);
    else { say("Alle 5 drauf! Zieh den Hebel! 👇"); hint(70, 600); $("lever").classList.add("hot"); document.querySelectorAll(".stack").forEach(s => s.classList.remove("hot")); }
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
}
async function leverDown(e){
  if (S.step !== 1 || S.cups.length < 5 || S.busy) { if (S.step === 1 && S.cups.length < 5){ sfx.nope(); say("Erst 5 Förmchen aufs Band! 🧁"); } return; }
  S.busy = true; hint(null); $("lever").classList.remove("hot"); sfx.lever();
  const arm = $("leverArm");
  await tween(260, t => arm.setAttribute("transform", `rotate(${-38 + 76 * t} 70 646)`));
  say("Los geht’s! 🚚");
  await moveAll(310 - SLOTS[0], 700);
  tween(400, t => arm.setAttribute("transform", `rotate(${38 - 76 * t} 70 646)`));
  S.step = 2; S.fill = 0; setMap(); S.busy = false;
  say("Tipp auf die Teigmaschine! 👆"); hint(310, 270); $("tank").classList.add("hot");
}
/* ---------- Schritt 2: Teig ---------- */
async function tankTap(e){
  if (S.step !== 2 || S.busy) return;
  S.busy = true; hint(null); sfx.squirt();
  const pl = $("plunger"), cp = S.cups[S.fill];
  $("tankMouth").setAttribute("d", "M300 343 Q310 356 320 343");
  await tween(160, t => pl.setAttribute("transform", `translate(0 ${12 * t})`));
  $("streams").innerHTML = `<rect class="stream" x="303" y="404" width="14" height="${BELT - CH + 18 - 404}" rx="7" fill="url(#doughG)" stroke="#E2B95A" stroke-width="2"/>`;
  const lvl = $("doughLevel"); const y0 = 250 + S.fill * 12;
  tween(500, t => lvl.setAttribute("d", `M256 ${y0 + 12 * t} Q283 ${y0 - 10 + 12 * t} 310 ${y0 + 12 * t} T364 ${y0 + 12 * t} V330 H256 Z`));
  await wait(450);
  cp.dough = true; drawCup(cp);
  $("streams").innerHTML = "";
  tween(200, t => pl.setAttribute("transform", `translate(0 ${12 - 12 * t})`));
  $("tankMouth").setAttribute("d", "M302 345 Q310 352 318 345");
  await tween(240, t => { cp.sy = 1 + Math.sin(t * Math.PI) * .12; place(cp); });
  say(["Blubb! 😋", "Noch einer! 🧁", "Mmmh, Teig! 😍", "Fast voll! 🙌", "Alle voll! 🎉"][S.fill]);
  if (S.fill < 4){ await moveAll(48, 520); S.fill++; S.busy = false; if (S.fill === 1) say("Nochmal tippen! 👆"); }
  else { await wait(400); step3(); }
}
/* ---------- Schritt 3: Ofen (läuft von allein, Kamera fährt mit) ---------- */
async function step3(){
  S.step = 3; setMap(); say("Ab in den Ofen! 🔥"); $("tank").classList.remove("hot");
  beltMoving(true);
  let last = performance.now(), done = false;
  const v = 95;
  const camStart = S.cam;
  // Kamera schwenkt zum Ofen, während das Band läuft
  tween(1600, t => setCam(camStart + (CAM[1] - camStart) * t));
  await new Promise(res => {
    const f = now => {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      S.cups.forEach(cp => {
        cp.x += v * dt;
        if (!cp.baked && cp.x > 560){ cp.baked = true; cp.sy = .78; drawCup(cp); tween(700, t => { cp.sy = .78 + .22 * t; place(cp); }, t => 1 - Math.pow(1 - t, 3)); }
        place(cp);
      });
      if (S.cups[4].x > 640 && !done){ done = true; }
      if (S.cups[4].x >= 820) return res();
      requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  });
  sfx.ding(); say("Ding! Alle gebacken! 🔔");
  // weiter zum Verzier-Tisch: Kamera fährt mit, die Muffins laufen auf ihre Plätze
  const SLOTS3 = [1108, 1052, 948, 892, 836];
  const sx = S.cups.map(c => c.x);
  const c0 = S.cam;
  await tween(1700, t => { setCam(c0 + (CAM[2] - c0) * t); S.cups.forEach((c, i) => { c.x = sx[i] + (SLOTS3[i] - sx[i]) * t; place(c); }); });
  beltMoving(false);
  step4();
}
/* ---------- Schritt 4: Verzieren mit Flaschen, Streuern und Klingel ---------- */
const BIG = {x: 925, y: 306, w: 150, h: 162};
function step4(){
  S.step = 4; setMap(); S.sel = 0; S.busy = false;
  document.querySelectorAll(".bottle").forEach(b => b.addEventListener("pointerdown", e => toolDown(e, b, "bottle")));
  document.querySelectorAll(".shaker").forEach(b => b.addEventListener("pointerdown", e => toolDown(e, b, "shaker")));
  $("bell").addEventListener("pointerdown", bellTap);
  liftUp();
}
async function liftUp(){
  const cp = S.cups[S.sel]; const sx = cp.x, sy0 = cp.y;
  // kleiner Hüpfer vom Band auf den Drehteller
  await tween(420, t => { cp.x = sx + (1000 - sx) * t; cp.y = sy0 - Math.sin(t * Math.PI) * 60 - (sy0 - 470) * t; place(cp); });
  $("cup" + cp.i).style.display = "none";
  drawBig(true);
  if (!cp.top){ say(S.sel === 0 ? "Zieh eine Guss-Flasche auf den Muffin! 👆" : `Muffin ${S.sel + 1} von 5 – welcher Guss?`); if (S.sel === 0) hint(936, 170); }
}
function drawBig(pop){
  const cp = S.cups[S.sel];
  $("bigM").innerHTML = `<g id="bigIn" ${pop ? 'class="popin"' : ""}>${nest(cupSvg(cp), BIG.x, BIG.y, BIG.w, BIG.h, 'id="bigSvg"')}</g>`;
}
function overMuffin(p){ return p.x > BIG.x - 10 && p.x < BIG.x + BIG.w + 10 && p.y > BIG.y - 70 && p.y < BIG.y + BIG.h * .62; }
function sprinkleAt(wx, wy, kind){
  const cp = S.cups[S.sel];
  if (!cp.top){ cp.top = "wood"; drawBig(); }
  const big = $("bigSvg"), top = big && big.querySelector(".k-top"); if (!top) return 0;
  const lx = 4 + (wx - BIG.x) / BIG.w * 52, ly = 4 + (wy - BIG.y) / BIG.h * 56;
  const n = kind === "herz" || kind === "stern" ? 2 : 4; let added = 0;
  for (let i = 0; i < n * 3 && added < n; i++){
    const x = lx + Math.random() * 12 - 6, y = ly + Math.random() * 8 - 4;
    const pt = big.createSVGPoint(); pt.x = x; pt.y = y;
    if (!top.isPointInFill(pt) || y > 31) continue;
    const c = kind === "bunt" ? ["#FF88A8","#FFD54A","#7DD9B4","#93BFF5","#C0A4F0","#FFB062"][Math.random() * 6 | 0]
            : kind === "schoko" ? ["#4A2E3A","#6E4429","#5A3A2E"][Math.random() * 3 | 0]
            : kind === "stern" ? ["#FFE45C","#FFF6C0","#FFD54A"][Math.random() * 3 | 0] : ["#FF88A8","#E8455F","#FFB3C8"][Math.random() * 3 | 0];
    cp.items.push({t: kind, x: +x.toFixed(1), y: +y.toFixed(1), r: Math.round(Math.random() * 180), c}); added++;
  }
  if (added){ drawBig(); sfx.sprinkle(); }
  return added;
}
function fall(wx, wy, kind){
  const cols = {bunt: ["#FF88A8","#FFD54A","#7DD9B4","#93BFF5"], schoko: ["#4A2E3A","#6E4429"], stern: ["#FFE45C"], herz: ["#FF88A8","#E8455F"]}[kind];
  for (let i = 0; i < 3; i++){
    const x = wx + Math.random() * 14 - 7, c = cols[i % cols.length];
    $("fxl").insertAdjacentHTML("beforeend", `<rect class="fallbit" x="${x}" y="${wy}" width="3" height="8" rx="1.5" fill="${c}" style="--d:${30 + Math.random() * 20}px"/>`);
    const el = $("fxl").lastElementChild; setTimeout(() => el.remove(), 420);
  }
}
async function pour(c, bx, by, el){
  const cp = S.cups[S.sel]; sfx.pour();
  $("fxl").insertAdjacentHTML("beforeend", `<path id="pourS" d="M1000 254 Q1002 280 1000 ${BIG.y + 20}" stroke="${PIC_PAL[c][2]}" stroke-width="9" stroke-linecap="round" fill="none" class="pourS"/>`);
  await wait(380); cp.top = c; drawBig(true); await wait(260); $("pourS")?.remove();
  say(cp.items.length ? "Lecker! ✨" : "Jetzt Streusel! Zieh einen Streuer drüber! 👆");
  if (S.sel === 0 && !cp.items.length) hint(872, 262);
}
function toolDown(e, el, type){
  if (S.step !== 4 || S.busy) return;
  e.preventDefault();
  if (type === "shaker" && el.classList.contains("locked")){
    sfx.nope(); const need = SHAK.find(s => s[0] === el.dataset.k)[3] - STARS;
    say(`🎧 ✅ ×${need} ➜ 🍒`); el.classList.remove("nope"); void el.getBoundingClientRect(); el.classList.add("nope"); return;
  }
  hint(null); sfx.pick();
  const inner = el.firstElementChild, homeX = +el.dataset.x, homeY = type === "bottle" ? 170 : 266;
  const p0 = toWorld(e); let moved = false, dx = 0, dy = 0, rot = 0, lastS = 0, pouring = false;
  el.parentNode.appendChild(el);   // nach vorn holen
  const put = () => inner.setAttribute("transform", `translate(${dx} ${dy}) rotate(${rot} ${homeX} ${homeY})`);
  const kind = el.dataset.k, color = el.dataset.c;
  const move = ev => {
    const p = toWorld(ev); if (Math.hypot(p.x - p0.x, p.y - p0.y) > 6) moved = true;
    dx = p.x - p0.x; dy = p.y - p0.y;
    const tip = {x: homeX + dx, y: homeY + dy + 30};
    const over = overMuffin(tip);
    rot = over ? (type === "bottle" ? 150 : 165) : 0; put();
    if (type === "shaker" && over && Date.now() - lastS > 70){ lastS = Date.now(); fall(tip.x, tip.y + 10, kind); sprinkleAt(tip.x, tip.y + 16 + Math.random() * 16, kind); }
    if (type === "bottle" && over && !pouring){ pouring = true; pour(color); }
  };
  const back = () => tween(260, t => { dx *= (1 - t); dy *= (1 - t); rot *= (1 - t); put(); }).then(() => inner.removeAttribute("transform"));
  const up = async () => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
    if (moved){ await back(); afterTool(); return; }
    // nur angetippt: Werkzeug fliegt selbst zum Muffin
    S.busy = true;
    const tx = 1000 - homeX, ty = (type === "bottle" ? 250 : 268) - homeY;
    await tween(320, t => { dx = tx * t; dy = ty * t; rot = (type === "bottle" ? 150 : 165) * t; put(); });
    if (type === "bottle") await pour(color);
    else for (let k = 0; k < 10; k++){ const a = Math.random() * 2 - 1; dx = tx + a * 40; put(); fall(homeX + dx, homeY + dy + 30, kind); sprinkleAt(homeX + dx, BIG.y + 30 + Math.random() * 26, kind); await wait(90); }
    await back(); S.busy = false; afterTool();
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
}
function afterTool(){
  const cp = S.cups[S.sel];
  if (cp.top && cp.items.length && !S.bellHinted){ S.bellHinted = true; say("Schön! 😍 Klingel für den nächsten Muffin! 🔔"); hint(1144, 420); }
}
async function bellTap(){
  if (S.step !== 4 || S.busy) return;
  S.busy = true; hint(null); sfx.ding();
  const bt = $("bellTop"); tween(300, t => bt.setAttribute("transform", `translate(0 ${Math.sin(t * Math.PI) * 6})`));
  const cp = S.cups[S.sel];
  // zurück aufs Band
  $("bigM").innerHTML = ""; const g = $("cup" + cp.i); g.style.display = ""; drawCup(cp);
  const SLOTS3 = [1108, 1052, 948, 892, 836], tx = SLOTS3[cp.i];
  await tween(380, t => { cp.x = 1000 + (tx - 1000) * t; cp.y = 470 + (BELT - 470) * t - Math.sin(t * Math.PI) * 40; place(cp); });
  if (S.sel < 4){ S.sel++; S.busy = false; liftUp(); return; }
  S.busy = false; finish();
}
/* ---------- Fertig ---------- */
function finish(){
  S.step = 5; sfx.yay();
  $("app").insertAdjacentHTML("beforeend", `<div class="end"><div class="endbox">
    <h2>Fertig! 🎉</h2><img src="img/fips-jubel.svg" alt="Fips freut sich">
    <p>„5 Muffins für mich? Ab zur Party!“</p>
    <div class="plate">${S.cups.map(cp => `<span>${cupSvg(cp)}</span>`).join("")}</div>
    <p class="small">In der App geht es jetzt auf die Party-Wiese – dort fütterst du diese 5 Muffins an Fips.</p>
    <button id="again">🔄 Nochmal backen</button></div></div>`);
  $("again").onclick = () => start();
}
function start(){ reset(); build(); step1(); }
start();
})();

</script>
